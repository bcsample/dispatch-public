# Open Window (v1) — live dashboard service config. Data, not code: tune
# sweep cadence / bind address here, no code changes needed. Absent file or
# absent keys fall back to the documented v1 defaults in brief/config.py.
sweep_interval_seconds: 900   # how often the sweep loop calls world.fetch_all()
port: 8808                    # suggested default port
host: 0.0.0.0                 # bind broadly so it's reachable from other devices on your network
recent_deltas_limit: 200      # how many recent world Items the board/map fetch per poll
news_interval_seconds: 600    # v2 — how often the news loop calls rss.fetch_all() (config/sources.yaml)
recent_news_limit: 100        # v2 — how many cached headlines /api/news returns by default

# v2: cap /api/current records per feed (OFAC has ~19k; keeps the 10s poll light)
current_records_limit: 200

# v3: Headlines firehose (config/news_firehose.yaml) — only show items
# published within this many hours, newest-first. Undated items are excluded.
news_window_hours: 2
# /api/news/digest window — a wider on-demand round-up for external voice/
# agent consumers, distinct from the live ticker's news_window_hours (2h) so
# an on-demand "give me the news" doesn't come back empty at a quiet moment.
news_digest_window_hours: 6

# v4.1: near-duplicate headline clustering via nomic-embed-text (Ollama),
# so "the same story from 5 sources" collapses into one item with sources
# aggregated. Off the 10s poll — runs only in the news loop (news_interval_
# seconds cadence). Fail-soft: Ollama unreachable -> raw headlines pass
# through unclustered, the window still works. Threshold calibrated
# 2026-07-16 against nomic-embed-text: known duplicate headline pairs
# measured 0.81-0.91 cosine similarity; unrelated pairs measured 0.35-0.41.
dedup_enabled: true
dedup_similarity: 0.80

# GDELT DOC 2.0 — a free, no-key global-news firehose (thousands of outlets)
# whose articles join the same news pipeline as RSS (dedup/geo/curation/surge).
# English-filtered so titles geolocate + dedup. Fail-soft: GDELT rate-limits to
# ~1 req/5s and a throttled cycle just falls back to RSS. Tune gdelt_query to
# refocus what GDELT pulls (GDELT query syntax; keep "sourcelang:eng").
gdelt_enabled: true
gdelt_query: "(war OR sanctions OR military OR election OR protest OR diplomacy OR attack OR crisis OR treaty OR coup) sourcelang:eng"
gdelt_timespan: "1h"
gdelt_max_records: 75

# NewsAPI.ai (Event Registry) — real-time BEAT feed. Needs NEWSAPI_KEY in .env
# (auto-loaded); auto-disables if the key is absent. Keyword-focused on the user's
# professional beat by default (see brief/ingest/newsapi.py DEFAULT_KEYWORDS);
# override newsapi_keywords to refocus. Same pipeline as RSS/GDELT.
# DIALED BACK 2026-07-24 (the user: "I got a note from News API that I've used
# half my tokens... I don't want to pay for anything"). Was called every
# 10-min cycle at count=40 (~144 calls/day) -- now every 6th cycle (~hourly)
# at count=15, while Google News RSS (below, free/no quota) takes over the
# beat-feed role day to day. Kept enabled (not retired) as a lower-frequency
# supplement, not the primary beat source anymore.
newsapi_enabled: true
newsapi_count: 15
newsapi_every_n_cycles: 6
# newsapi_keywords: ["defense contract", "HUMINT", "DIA", "post-quantum"]

# Google News RSS — free (no key, no quota) beat feed, the NewsAPI.ai
# replacement. Keywords are a small persisted list (data/
# google_news_keywords.json, seeded from brief/ingest/googlenews.py
# DEFAULT_KEYWORDS on first run), editable live from GET /keywords -- NOT a
# config list here, so the user can add/remove beat terms without touching YAML
# or restarting the service.
googlenews_enabled: true
googlenews_count_per_keyword: 8

# dispatch-alerts-v1 (/api/alerts) — the live "really important things" feed
# for voice consumers (scripts/dispatch_speak.py, or your own external
# voice agent). Deterministic,
# LLM-free. An alert is: a world event at/above alerts_min_severity seen in
# the last 24h, OR a news story that alerts_min_sources+ independent outlets
# carry within alerts_fresh_minutes of us first seeing it.
alerts_min_severity: 6.5   # news monitor: only MAJOR quakes alert (map pulse + voice)
alerts_min_sources: 3
alerts_fresh_minutes: 30

# Surge detection (alert kind "surge"): a place whose last-hour story count is
# a surge_z-sigma outlier vs its hourly baseline (and at least surge_min_stories
# raw — 2 stories is never a surge). brief/window/surge.py.
surge_min_stories: 3
surge_z: 3.0

# THE VOICE is deliberately rarer than the board. The board shows every alert;
# only "speak_worthy" ones are ever read aloud: watchlist (his beat) and major
# world events always, news only when this many outlets carry it, surges only
# when this big. Plus a minimum gap between utterances (speaker-side).
# Target: a handful of times a day, not every minute.
speak_min_sources: 8
speak_surge_min_stories: 6
# The voice reads on a SCHEDULE, not whenever something lands: a short bulletin
# at the top and bottom of the hour. Alerts accumulate between slots and are
# read as one batch, so the wall is predictable instead of interrupting at
# random. Minutes past the hour to read at; window = how long after each slot
# the read may still happen (the speaker polls every 60s).
speak_schedule_minutes: [0, 30]
speak_schedule_window_minutes: 2
# The voice only speaks during working hours: silent OUTSIDE this window. Set to
# [09:00, 17:00) — quiet starts at 17:00, ends at 09:00 (wraps overnight).
speak_quiet_start_hour: 17
speak_quiet_end_hour: 9
# ...and only on weekdays. When true the voice stays silent all day Sat/Sun (the
# board still shows everything). Set false for a 7-day voice.
speak_weekdays_only: true
# Extra meeting signal on top of mic-in-use: an OPTIONAL Google Calendar
# check (see brief/window/calendar_check.py -- bring your own read-only
# integration, or leave this off) for an event covering right now. Catches
# call audio routed through a different device, and the exact instant a
# scheduled meeting starts (the bulletin's own :00/:30 cadence collides with
# that by construction). Fail-soft: any problem -> assumed no meeting,
# mic-in-use remains the primary signal regardless.
speak_check_calendar: true
# Skip the scheduled bulletin when nobody's touched the machine in a while
# (system-wide HID idle time -- nobody's there to hear it if nobody's
# touched the machine in a while). Deliberately scoped to the
# SCHEDULED bulletin only, never the manual read-news button (a click
# already proves someone's there).
speak_skip_when_display_idle: true
speak_display_idle_minutes: 20
# The VOICE ITSELF. "kokoro" = a local neural voice (bm_george, British
# male) -- CPU/RAM only, no cloud, no GPU required. Weights aren't bundled
# (see brief/window/kokoro_tts.py); download them once and set
# DISPATCH_KOKORO_DIR, or just leave this on "kokoro" and let it fall back
# to macOS `say` (Daniel) automatically if the weights aren't found -- the
# wall never goes mute either way. Set speak_engine: say to force the
# fallback outright. speed 1.0 = natural.
speak_engine: kokoro
speak_kokoro_voice: bm_george
speak_kokoro_lang: en-gb
speak_kokoro_speed: 1.0

# Curation (pillar 3, "ranked to the user's beat"): one batched local qwen3.5:9b
# scoring pass per news cycle against config/profile.yaml. HARD RULE: skipped
# whenever ComfyUI (comfyui_url) has anything running or queued — renders are
# sacred, curation is best-effort. Stories scoring >= curation_min_score get a
# BEAT badge on the board and a "watchlist" alert (spoken by the speaker).
# qwen3.5:9b is a reasonable general-purpose default for local curation --
# swap curation_model for whatever you have pulled in Ollama.
# Quiet hours here wrap midnight like the voice's own quiet hours
# (brief/window/quiet.py), but this is a SEPARATE window, not the same knob.
curation_enabled: true
curation_model: qwen3.5:9b
curation_min_score: 8
curation_quiet_start_hour: 18
curation_quiet_end_hour: 9
comfyui_url: http://localhost:8000

# "Skies" board (/api/flights) — live aircraft near you, departure-board style
# (inspired by theflightwall.com). Free no-auth ADS-B (adsb.fi), no LLM, no
# ComfyUI memory risk. Set flights_lat/lon to enable (empty -> panel hidden).
# Default: Reagan National / Washington, DC area. Move the box by editing
# these to your own location (lat/lon of the center point you want to watch).
flights_lat: 38.85
flights_lon: -77.04
flights_radius_nm: 25   # zoomed in for a legible local view (keeps DCA + IAD)
flights_limit: 12
flights_interval_seconds: 25
