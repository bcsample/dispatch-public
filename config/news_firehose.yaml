# Open Window (v3) news firehose — window-specific, broad roster for the
# "last 2 hours, prominent" Headlines panel. Same {name,type,trust,rss}
# schema as config/sources.yaml. This file is separate ON PURPOSE: the
# curated AM Apps Script digest keeps reading sources.yaml unchanged; the
# window's news loop reads THIS file if it exists (config.load_news_firehose()),
# falling back to sources.yaml only if this file is absent.
#
# Every entry below was fetch-tested with feedparser.parse() on 2026-07-16 and
# returned real entries at the time of testing. Dead candidates (403s, 404s,
# redirects to nowhere) were dropped rather than guessed at — see
# 's v3 report for the full kept/dropped list.
# Fail-soft: if a feed goes dark later, brief/ingest/rss.py already skips it
# and logs, the rest of the firehose keeps flowing.
sources:
  # --- existing curated set (config/sources.yaml), carried in unchanged ---
  - name: Defense One
    type: news
    trust: high
    rss: https://www.defenseone.com/rss/all/
  - name: Breaking Defense
    type: news
    trust: high
    rss: https://breakingdefense.com/feed/
  - name: DefenseScoop
    type: news
    trust: high
    rss: https://defensescoop.com/feed/
  - name: FedScoop
    type: news
    trust: medium
