# Dispatch's declared style. Written 2026-09-08 during weekly hygiene, because
# "ruff ok / fmt ok" is unassertable with no declared style (CLAUDE.md, Weekly
# hygiene leg 2) -- before this file, the 09-06 line was green against ruff's
# narrow DEFAULT rule set (E4,E7,E9,F), not the project baseline. Under the
# real baseline the repo had 32 findings.
#
# line-length 88 is not a choice so much as a measurement: `ruff format --check`
# reported all 71 files already clean at 88, so this declares what the repo is.
# Raising it to 100 would have silenced 19 of the 21 E501s and churned 47 files
# to do it -- a green line bought by moving the line, which is not hygiene.

line-length = 88

[format]
# UP-1, 2026-09-14, declared BEFORE the first `ruff format` on 0.16: ruff 0.16 formats
# Python code blocks inside Markdown by default, and this repo's .md files hold
# dated notes and quoted testimony that are never rewritten (CLAUDE.md leg 2).
# Measured the same day: 10 tracked .md files, 0 Python code fences, so this changes
# nothing today and keeps it that way.
exclude = ["*.md"]

[lint]
# The project baseline (CLAUDE.md). Deliberately NOT PL/SIM/UP: those
# manufacture failures on deliberate code, and a rule set that does that is not
# hygiene.
select = ["E", "F", "W", "I", "B", "C4"]
