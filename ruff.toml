# Dispatch's declared style.
#
# line-length 88 matches what the code is actually formatted to; `ruff format
# --check` is clean at that width.
line-length = 88

[format]
# The .md files here carry dated notes that are not rewritten, and ruff 0.16
# formats Python code blocks inside Markdown by default.
exclude = ["*.md"]

[lint]
select = ["E", "F", "W", "I", "B", "C4"]

# E501 (line-too-long) is ignored HERE and only here, for one specific reason.
#
# The Python in this repo is generated from a private original by a sanitizing
# build step that substitutes internal names for neutral ones. Several of those
# substitutions are longer than what they replace, so comment and docstring
# lines that sit inside 88 columns upstream arrive here over the limit. Nobody
# wrote those lines at this width, and nobody can usefully fix them in this
# repo -- the next build would overwrite the fix.
#
# The rule is ignored rather than the limit raised, so that `line-length = 88`
# still means something for `ruff format`, and so this comment stays the
# explanation instead of a silently wider number. Every other baseline rule
# applies in full: real lint findings still fail here.
ignore = ["E501"]
